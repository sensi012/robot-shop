# Custom Helm Values for kube-prometheus-stack (Capstone 2: Keep It Running)

grafana:
  adminPassword: "adminpassword123"
  service:
    type: LoadBalancer # Exposes Grafana publicly via an AWS Network/Classic LoadBalancer

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 2d # Keeps Prometheus resource-efficient on cloud instances
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 1536Mi
        cpu: 500m

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 256Mi
        cpu: 100m
